<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EsCee Hub - Email Confirmed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<style> 
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Outfit', sans-serif;
    }

    body {
        font-family: 'Outfit', sans-serif;
        background-color: #F4F4F4;
    }
    .confirmation {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        min-height: 100vh;
        width: 100%;
        padding: 0 0 2rem 0;
    }   

    .confirmation-heading {
        height: 45vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        gap: 4rem;
        background: linear-gradient(135deg, #072059 0%, #0B328C 50%, #0F45BF 100%);
        color: #FFFFFF;
        padding: 2rem 3vw 5rem 3vw;
        align-items: center;
        border-bottom-left-radius: 3rem;
        border-bottom-right-radius: 3rem;
        flex-shrink: 0;
    }

    .confirmation-title {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 0.5rem;
        justify-content: center;
    }

    .confirmation-title h1 {
        font-size: 2.5rem;
        font-weight: 700;
        line-height: 1.2;
    }

    .confirmation-title img {
        width: auto;
        height: 100px;
    }

    .confirmation-content {
        padding: 1.5rem;
        background-color: #FFFFFF;
        border-radius: 2.5rem;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0.8rem;
        max-width: 550px;
        color: #1D1D1D;
        z-index: 2;
        width: 85%;
        margin-top: -10vh;
    }

    .top-content  {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding-top: 2rem;
        gap: 0.8rem;
    }

    .top-content h1 {
        font-size: 1.6rem;
        font-weight: 600;
    }

    .top-content svg {
        width: 78px;
        height: 78px;
    }

    .middle-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 1.5rem;
        gap: 0.8rem;
    }

    .middle-content p {
        margin-top: 1rem;
        font-size: 0.9rem;
        line-height: 1.5;
        color: #616161;
        font-weight: 400;
    }

    .bottom-content {
        margin-top: 2rem;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 0.8rem;
        text-align: left;
        color: #616161;
        background-color: #F3F4F6;
        padding: 1.5rem;
        border-radius: 1.5rem;
    }

    .bottom-content h2 {
        font-size: 0.9rem;
        font-weight: 600;
    }

    .bottom-content p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #616161;
        font-weight: 400;
    }

    .confirmation-footer {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        padding-bottom: 2rem;
        position: relative;
        margin-top: 3rem;
        gap: 0.5rem;
        z-index: 1;
    }

    .confirmation-footer img     {
        width: 50px;
        height: 50px;
    }

    .confirmation-footer p {
        font-size: 0.7rem;
        text-align: center;
        padding: 0 5rem;
        line-height: 2;
        color: #616161;
        font-weight: 400;

    }
</style>
<body>
    <section class="confirmation">
        <div class="confirmation-heading">
            <div class="confirmation-title">
                <img src="eh-logo.png" alt="EsCee Hub Logo">
                <h1>EsCee<br>Hub</h1>
            </div>
        </div>

        <div class="confirmation-content">
            <div class="top-content">
                <svg xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24">

                    <defs>
                    <linearGradient id="iconGradient"
                                    x1="0%" y1="0%"
                                    x2="100%" y2="0%"
                                    gradientTransform="rotate(36)">
                        <stop offset="0%" stop-color="#FE8D3F" />
                        <stop offset="100%" stop-color="#FFC84C" />
                    </linearGradient>
                    </defs>

                    <path fill="url(#iconGradient)"
                        fill-rule="evenodd"
                        d="M22 12c0 5.523-4.477 10-10 10S2 17.523 2 12S6.477 2 12 2s10 4.477 10 10m-5.97-3.03a.75.75 0 0 1 0 1.06l-5 5a.75.75 0 0 1-1.06 0l-2-2a.75.75 0 1 1 1.06-1.06l1.47 1.47l2.235-2.235L14.97 8.97a.75.75 0 0 1 1.06 0"
                        clip-rule="evenodd" />
                </svg>

                <div class="top-text">
                    <h1>Email Confirmed!</h1>
                </div>
                </div>


            <div class="middle-content">
                <p>Your email has been successfully verified. You can now access the EsCee Hub!</p>
            </div>

            <div class="bottom-content">
                <h2>Next Steps:</h2>
                <p>1. Open the EsCee Hub</p>
                <p>2. Log in using student ID and password</p>
                <p>3. Start your journey!</p>
            </div>
        </div>

        <footer class="confirmation-footer">
            <img src="plv-logo.png" alt="">
            <p>Having trouble logging in? Coordinate with the social contract office to fix the issue.</p>
        </footer>
    </section>
</body>
</html>
